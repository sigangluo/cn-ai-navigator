name: AI maintenance proposal

on:
  schedule:
    - cron: "42 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    if: vars.ENABLE_AI_MAINTENANCE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ask Codex to review source health
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: .github/ai-maintenance-prompt.md
      - name: Validate proposed changes
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/update.py --offline
          python3 scripts/build.py
      - name: Open a reviewable pull request when files changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/sources.json scripts/ tests/ site/assets/ site/index.html site/data/
          if git diff --cached --quiet; then
            echo "No verified changes proposed."
            exit 0
          fi
          branch="ai-maintenance/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "maintenance: AI source health proposal"
          gh auth setup-git
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "AI maintenance: source health proposal" --body "Codex reviewed the latest source snapshot and proposed changes. Please review the diff and test results before merging."
