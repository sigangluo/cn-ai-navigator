<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13242a">
  <meta name="description" content="AI 信息源目录：查看各来源的最新发布，直达官网阅读。">
  <title>AI Source Desk · AI 信息源</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip" href="#content">跳到来源列表</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="home" href="#content" aria-label="AI Source Desk 首页"><span class="brand-mark" aria-hidden="true">✳</span><span>AI SOURCE DESK</span></a>
      <div class="header-status"><span><strong id="sourceCount">—</strong> 个来源</span><span id="syncTime">正在加载…</span></div>
    </div>
  </header>

  <main id="content" class="workspace">
    <aside class="sidebar" aria-label="分类导航">
      <div class="sidebar-title">浏览分类 <span>INDEX</span></div>
      <nav id="groupNav"></nav>
      <p class="sidebar-note">先按内容分类，再按入口页面的主要语言分为中文、非中文。所有来源始终保留官网入口。</p>
    </aside>
    <div class="main-panel">
      <div class="toolbar">
        <div class="toolbar-title"><span class="section-kicker">SOURCE INDEX</span><h1>数据源 <span id="visibleCount"></span></h1></div>
        <div class="controls">
          <label class="search-wrap"><span class="sr-only">搜索来源</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"></circle><path d="m16 16 5 5"></path></svg><input id="search" type="search" placeholder="搜索来源、机构、官网栏目…"></label>
          <label class="today-switch"><input id="todayOnly" type="checkbox"><span class="switch-track"></span>只看今天更新</label>
        </div>
      </div>
      <div class="legend" aria-label="颜色说明"><span><i class="dot fresh"></i> 今天发布</span><span><i class="dot recent"></i> 此前发布</span><span><i class="dot manual"></i> 官网入口</span><span><i class="dot error"></i> 同步异常</span><span class="timezone">日期按新加坡时间</span></div>
      <div class="sync-notice" id="syncNotice" role="status" hidden></div>
      <div id="sections" aria-live="polite"><div class="loading">正在整理数据源…</div></div>
    </div>
  </main>
  <footer><span>AI SOURCE DESK</span><span>来源索引，原文直达。内容与版权属于各发布者。</span></footer>
  <script src="assets/app.js" defer></script>
</body>
</html>
